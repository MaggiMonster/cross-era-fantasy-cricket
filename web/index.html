<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cross-Era Cricket Duel</title>
  <style>
    :root { --panel: rgba(10, 22, 40, .88); --ink: #f8fafc; --muted: #a9b8c9; --accent: #fbbf24; --out: #f87171; --four: #4ade80; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1628; color: var(--ink); font: 15px/1.3 system-ui, -apple-system, sans-serif; }
    #stage, #stage canvas { position: fixed; inset: 0; display: block; }
    #board { position: fixed; top: 16px; left: 16px; display: flex; align-items: stretch; background: var(--panel); border-radius: 8px; overflow: hidden; }
    #score { padding: 10px 16px; background: var(--accent); color: #111827; font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; display: flex; align-items: center; }
    #info { padding: 8px 14px; display: grid; gap: 2px; }
    #names { font-weight: 700; letter-spacing: .03em; }
    #meta { color: var(--muted); display: flex; gap: 12px; font-variant-numeric: tabular-nums; }
    #lives { color: var(--out); letter-spacing: .12em; }
    #matchups { position: fixed; top: 16px; right: 16px; display: flex; gap: 4px; background: var(--panel); padding: 4px; border-radius: 8px; }
    #matchups a { color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 5px; font-size: 13px; }
    #matchups a.active { background: #1e3a5f; color: var(--ink); }
    #view { padding: 6px 10px; font-size: 13px; text-transform: none; white-space: nowrap; }
    #bottom { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(820px, calc(100vw - 32px)); display: grid; gap: 8px; justify-items: center; }
    #call { background: var(--panel); padding: 7px 16px; border-radius: 8px; text-align: center; }
    #result { font-weight: 800; font-size: 19px; }
    #result:empty { display: none; }
    #result.wicket { color: var(--out); }
    #result.boundary { color: var(--four); }
    #shots { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; width: 100%; background: var(--panel); padding: 6px; border-radius: 8px; }
    #shots.locked { opacity: .45; pointer-events: none; }
    button { font: inherit; color: var(--ink); background: #1e3a5f; border: 0; border-radius: 5px; padding: 7px 2px; cursor: pointer; text-transform: capitalize; min-width: 0; }
    button:hover { background: #2b5288; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    kbd { display: block; font: 700 11px system-ui; color: var(--accent); }
    #hint { color: #e2e8f0; font-size: 12px; text-shadow: 0 1px 3px #000; text-align: center; }
    #banner { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; background: rgba(5, 12, 24, .62); }
    #banner[hidden], #error[hidden] { display: none; }
    #banner-title { font-size: clamp(30px, 6vw, 56px); font-weight: 900; color: var(--accent); }
    #banner-detail { margin: 6px 0 16px; }
    #again { padding: 10px 20px; text-transform: none; font-weight: 700; }
    #error { position: fixed; inset: auto 16px 16px; background: #7f1d1d; padding: 12px; border-radius: 6px; }
    #bowling { display: grid; gap: 4px; width: 100%; background: var(--panel); padding: 6px; border-radius: 8px; }
    #bowling[hidden], #shots[hidden] { display: none; }
    #bowling.locked { opacity: .45; pointer-events: none; }
    .bowl-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
    #bowl-lines { grid-template-columns: repeat(3, 1fr) 1.4fr; }
    #bowling button.active, #menu button.active { background: var(--accent); color: #111827; }
    #bowling button.active kbd { color: #111827; }
    #menu { position: fixed; inset: 0; z-index: 5; overflow: auto; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 16px; background: radial-gradient(circle at 50% 20%, #17345a, #0a1628 70%); }
    #menu-box > *, #menu-players > *, #menu-options > *, #menu-modes > * { min-width: 0; }
    #menu[hidden] { display: none; }
    #menu-box { width: min(860px, 100%); display: grid; gap: 16px; }
    #menu h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); line-height: 1.05; }
    #menu h2 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
    #menu-players { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .card { display: grid; justify-items: center; gap: 3px; padding: 10px 6px; text-transform: none; border: 2px solid transparent; }
    #menu .card.active { background: #1e3a5f; color: var(--ink); border-color: var(--accent); }
    .card small { color: var(--muted); }
    .face { width: min(128px, 100%); aspect-ratio: 1; border-radius: 6px; display: grid; place-items: center; font-size: 38px; font-weight: 900; background-size: cover; background-position: center; }
    #menu-options { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; }
    #menu-modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    #menu-modes button { text-transform: none; padding: 9px 2px; }
    #menu select { width: 100%; font: inherit; color: var(--ink); background: #1e3a5f; border: 0; border-radius: 5px; padding: 9px 6px; }
    #menu-start { padding: 13px; font-size: 17px; font-weight: 800; text-transform: none; background: var(--accent); color: #111827; }
    #menu-start:hover { background: #fcd34d; }
    @media (max-width: 680px) {
      #menu-players { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #menu-options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #menu-options > :first-child { grid-column: 1 / -1; }
      #shots { grid-template-columns: repeat(4, 1fr); }
      #matchups { top: 96px; left: 16px; right: auto; }
      #score { font-size: 22px; padding: 8px 10px; }
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <section id="board" aria-label="Scoreboard">
    <div id="score">0/0</div>
    <div id="info">
      <div id="names"></div>
      <div id="meta"><span id="target"></span><span id="overs"></span><span id="lives" aria-label="Lives"></span></div>
      <div id="need"></div>
    </div>
  </section>
  <nav id="matchups" aria-label="Matchup">
    <a data-matchup="tendulkar-bumrah" href="?matchup=tendulkar-bumrah">Sachin v Bumrah</a>
    <a data-matchup="kohli-warne" href="?matchup=kohli-warne">Kohli v Warne</a>
    <a href="./">Menu</a>
    <button id="view" type="button"></button>
  </nav>
  <section id="bottom">
    <div id="call" aria-live="polite"><div id="result"></div><div id="delivery"></div></div>
    <div id="shots" role="group" aria-label="Choose a shot"></div>
    <div id="bowling" role="group" aria-label="Choose length and line" hidden>
      <div class="bowl-row" id="bowl-lengths"></div>
      <div class="bowl-row" id="bowl-lines"></div>
    </div>
    <div id="hint"></div>
  </section>
  <main id="menu" hidden>
    <div id="menu-box">
      <h1>Cross-Era Cricket Duel</h1>
      <section>
        <h2>Pick a player. Matchups are always old era against new era.</h2>
        <div id="menu-players"></div>
      </section>
      <section id="menu-options">
        <div><h2>Mode</h2><div id="menu-modes"></div></div>
        <div><h2><label for="menu-overs">Overs</label></h2><select id="menu-overs"><option>1</option><option>2</option><option selected>3</option><option>5</option></select></div>
        <div><h2><label for="menu-lives">Lives</label></h2><select id="menu-lives"><option>1</option><option>2</option><option selected>3</option><option>5</option></select></div>
      </section>
      <button id="menu-start" type="button">Play <span id="menu-duel"></span></button>
    </div>
  </main>
  <div id="banner" hidden>
    <div id="banner-title"></div>
    <div id="banner-detail"></div>
    <div><button id="again">Play again (R)</button></div>
  </div>
  <div id="error" role="alert" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
